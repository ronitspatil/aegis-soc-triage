[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegis-soc"
version = "0.1.0"
description = "Autonomous SOC alert triage agent built with LangGraph"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["security", "soc", "siem", "langgraph", "llm", "triage"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "langgraph>=0.2.60",
    "langchain-core>=0.3.29",
    "langchain-ollama>=0.2.2",
    "langchain-openai>=0.2.14",
    "langchain-anthropic>=0.3.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Ingestion API, durable checkpoints, Slack and MCP surfaces.
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.2",
    "slack_sdk>=3.33",
    "mcp>=2.2",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "grandalf>=0.8",
]

[project.scripts]
aegis-triage = "aegis.triage:main"
aegis-simulate = "aegis.simulation.__main__:main"
aegis-slack = "aegis.notify.slack_handler:main"
aegis-hunt = "aegis.hunt_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["aegis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# Fail on warnings we care about rather than letting them scroll past.
filterwarnings = ["error::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # FastAPI dependency defaults
    "UP042",  # `str, Enum` is intentional: members compare equal to their
              # string value, which keeps JSON and checkpoint round-trips simple
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
